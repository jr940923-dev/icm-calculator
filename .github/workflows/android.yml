# 안드로이드 앱(APK) 자동 만들기
# - index.html / icon.png 가 바뀌어 올라오면 자동으로 새 APK 를 만들어요.
# - 완성된 APK 는 저장소의 "Releases" (app-latest) 에 올라가요.
name: Android APK

on:
  push:
    paths: ["*.html", "icon.png", "icon-fg.png", "debug.keystore", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # AdMob 앱 ID. 지금은 구글 공식 테스트 ID. 출시 때 AdMob에서 받은 "앱 ID"로 바꿔요 (광고 단위 ID 아님)
  ADMOB_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 앱 프로젝트 만들기 (Capacitor)
        run: |
          mkdir -p app/www
          cp *.html app/www/
          cd app
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @capacitor/share@7 @capacitor/filesystem@7 @capacitor-community/admob@7
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.icmcalc.app",
            "appName": "ICM 계산기",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "force" }
          }
          JSON
          npx cap add android
          # AdMob 앱 ID를 앱 설정(AndroidManifest)에 넣기
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: 앱 아이콘 넣기
        run: |
          pip install pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = "app/android/app/src/main/res"
          full = Image.open("icon.png").convert("RGBA")
          fg = Image.open("icon-fg.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, s in sizes.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              sq = full.resize((s, s), Image.LANCZOS)
              sq.save(f"{folder}/ic_launcher.png")
              m = Image.new("L", (s, s), 0); ImageDraw.Draw(m).ellipse([0, 0, s - 1, s - 1], fill=255)
              rd = sq.copy(); rd.putalpha(m); rd.save(f"{folder}/ic_launcher_round.png")
              f = int(s * 108 / 48)
              fg.resize((f, f), Image.LANCZOS).save(f"{folder}/icm_fg.png")
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/icm_icon_bg"/>\n  <foreground android:drawable="@mipmap/icm_fg"/>\n</adaptive-icon>\n'
          for n in ("ic_launcher", "ic_launcher_round"):
              open(f"{res}/mipmap-anydpi-v26/{n}.xml", "w").write(xml)
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/icm_icon.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="icm_icon_bg">#138A5F</color>\n</resources>\n')
          PY

      - name: 서명 키 준비 (매번 같은 키 → 덮어쓰기 설치 가능)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: APK 빌드
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ICM-calculator.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ICM-calculator-apk
          path: ICM-calculator.apk

      - name: Releases 에 올리기 (폰에서 바로 다운로드용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: ICM 계산기 (테스트용 APK)
          body: 폰에서 ICM-calculator.apk 를 눌러 다운로드 → 설치하세요.
          files: ICM-calculator.apk
          make_latest: true
