<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<title>토너먼트 ICM 계산기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f2f4f6;--card:#ffffff;--text:#191f28;--sub:#4e5968;--muted:#8b95a1;--line:#e5e8eb;--field:#f2f4f6;
  --pri:#0e9f6e;--pri-strong:#0a7f58;--pri-soft:#e3f6ee;--on-pri:#ffffff;
  --neg:#e5484d;--pos:#0e9f6e;--gold:#f0b429;
  --felt1:#1aa874;--felt2:#0b6b49;--rail:#2d3138;--seat:#ffffff;
  --shadow:0 2px 12px rgba(0,27,55,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101214;--card:#1b1e22;--text:#eceef0;--sub:#b0b8c1;--muted:#7f8893;--line:#2b2f34;--field:#24282d;
    --pri:#2fbf8a;--pri-strong:#46d49f;--pri-soft:#143a2d;--on-pri:#06251a;
    --neg:#ff6b6f;--pos:#46d49f;--gold:#f5c451;
    --felt1:#138a5f;--felt2:#094a33;--rail:#3a3f47;--seat:#2a2e35;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--bg)}
.top-inner{max-width:560px;margin:0 auto;padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.logo{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:17px}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.steps{max-width:560px;margin:0 auto;padding:2px 16px 12px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.st{border:0;background:none;padding:0;text-align:left;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.st .bar{display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:6px;transition:background .2s}
.st.done .bar,.st.cur .bar{background:var(--pri)}
.st.cur{color:var(--text);font-weight:700}

main{max-width:560px;margin:0 auto;padding:4px 16px 120px}
.title{font-size:24px;font-weight:800;margin:10px 2px 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 2px 18px;font-size:15px}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 14px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.card-head h2{margin:0}
.pill{font-size:12px;font-weight:700;color:var(--pri-strong);background:var(--pri-soft);padding:5px 10px;border-radius:999px;white-space:nowrap}

/* 입력 */
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field > label,.lbl{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.inp{display:flex;align-items:center;background:var(--field);border-radius:12px;padding:0 14px;border:2px solid transparent;transition:border-color .15s,background .15s}
.inp:focus-within{border-color:var(--pri);background:var(--card)}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:inherit;font-size:17px;font-weight:600;color:var(--text);padding:13px 0;outline:none}
.inp input::placeholder{color:var(--muted);font-weight:500}
.inp .suf{color:var(--muted);font-weight:600;font-size:15px;margin-left:6px;white-space:nowrap}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .inp{padding:0 12px}
.help{font-size:13px;color:var(--muted);margin:8px 2px 0}
.help b{color:var(--sub)}

.stepper{display:flex;align-items:center;gap:8px}
.stepper .inp{flex:1}
.stepper .inp input{text-align:center}
.sbtn{width:50px;height:50px;flex:none;border:0;border-radius:14px;background:var(--field);font-size:22px;font-weight:600;color:var(--sub)}
.sbtn:active{background:var(--line)}

/* 상금 행 */
.phead,.prow{display:grid;grid-template-columns:62px 1fr 92px 30px;gap:6px;align-items:center}
.phead{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px}
.prow{margin-bottom:8px}
.prow .rank{font-weight:700;font-size:14px;color:var(--sub);white-space:nowrap}
.prow .inp{padding:0 10px}
.prow .inp input{font-size:16px;padding:11px 0}
.cnt{display:flex;align-items:center;background:var(--field);border-radius:12px;height:48px}
.cnt button{border:0;background:none;width:28px;height:100%;font-size:18px;color:var(--sub)}
.cnt input{width:100%;min-width:0;border:0;background:none;text-align:center;font:inherit;font-weight:700;font-size:15px;color:var(--text);outline:none;padding:0}
.del{border:0;background:none;color:var(--muted);font-size:16px;height:40px}
.btn-add{width:100%;border:2px dashed var(--line);background:none;border-radius:12px;padding:12px;font-weight:700;color:var(--pri-strong);margin-top:4px}

/* 인원 선택 */
.count-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cnt-btn{border:2px solid transparent;background:var(--field);border-radius:16px;padding:14px 0 10px;display:flex;flex-direction:column;align-items:center}
.cnt-btn b{font-size:26px;line-height:1.1}
.cnt-btn span{font-size:12px;color:var(--muted);font-weight:600}
.cnt-btn.on{border-color:var(--pri);background:var(--pri-soft)}
.cnt-btn.on b{color:var(--pri-strong)}
.cnt-btn:disabled{opacity:.35}

/* 테이블 */
.table-card{padding:14px}
.table-wrap{position:relative;width:100%;aspect-ratio:1/0.82;margin:6px 0}
.felt{position:absolute;inset:13% 13%;border-radius:999px;background:radial-gradient(ellipse at center,var(--felt1),var(--felt2));
  border:9px solid var(--rail);box-shadow:inset 0 0 24px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.felt-in{color:rgba(255,255,255,.92);font-size:12px;text-align:center;line-height:1.5;font-weight:600}
.felt-in b{font-size:15px;display:block}
.seat{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:14px;background:var(--seat);padding:6px 8px;min-width:60px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);color:var(--text);line-height:1.25;transition:transform .1s}
.seat:active{transform:translate(-50%,-50%) scale(.96)}
.seat b{display:block;font-size:12px;font-weight:800}
.seat span{font-size:12px;color:var(--sub);font-weight:600}
.seat.avg span{color:var(--muted)}
.seat.hero{background:var(--pri);color:#fff}
.seat.hero span{color:rgba(255,255,255,.9)}
.seat.sel{outline:3px solid var(--gold);outline-offset:2px}
.seat.edited::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.dealer{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#fff;color:#111;
  font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .d-hero{background:var(--pri)}.legend .d-ed{background:var(--gold)}.legend .d-avg{background:var(--line)}

.ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.ed-pos{font-size:20px;font-weight:800}
.ed-sub{font-size:13px;color:var(--muted);font-weight:600}
.tag{font-size:11px;background:var(--pri);color:#fff;padding:2px 7px;border-radius:999px;vertical-align:3px;margin-left:4px}
.toggle{border:2px solid var(--line);background:none;border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--sub)}
.toggle.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-strong)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qb{border:0;background:var(--field);border-radius:10px;padding:8px 11px;min-height:42px;font-size:13px;font-weight:700;color:var(--sub)}
.qb:active{background:var(--line)}
.ed-nav{display:flex;justify-content:space-between;margin-top:16px}
.link{border:0;background:none;color:var(--pri-strong);font-weight:700;font-size:14px;padding:6px 0}

/* 결과 */
.hero-card{background:linear-gradient(135deg,#0e9f6e,#0a7453);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:12px;box-shadow:0 6px 20px rgba(14,159,110,.25)}
.hc-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;opacity:.95}
.badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:999px}
.hc-big{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:6px 0 14px}
.hc-big small{font-size:20px;margin-left:2px}
.hc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(0,0,0,.14);border-radius:14px;padding:12px}
.hc-grid div{display:flex;flex-direction:column}
.hc-grid span{font-size:12px;opacity:.8}
.hc-grid b{font-size:16px}
.hc-diff{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;gap:8px}
.hc-diff span{opacity:.85}
.hc-diff b{font-size:15px;white-space:nowrap}
.info-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:0;padding-bottom:0}
.info-row:first-child{padding-top:0}
.info-ic{font-size:20px;line-height:1.3}
.info-row b{display:block;font-size:15px}
.info-row p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.rrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rpos{font-weight:700}
.rpos small,.rval small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.rval{text-align:right;font-weight:700}
.rbar{grid-column:1/3;height:6px;border-radius:6px;background:var(--field);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--line);border-radius:6px}
.rrow.me .rpos,.rrow.me .rval{color:var(--pri-strong)}
.rrow.me .rbar i{background:var(--pri)}
.edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.edit-grid button{border:0;background:var(--field);border-radius:12px;padding:12px 4px;font-weight:700;font-size:13px;color:var(--sub)}
.loading{text-align:center;padding:40px 20px}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pri);margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 카드 */
:root{--spade:#1f2937}
@media (prefers-color-scheme: dark){:root{--spade:#e5e7eb}}
.s0{color:var(--spade)}.s1{color:#e5484d}.s2{color:#2f6fed}.s3{color:#0e9f6e}
.cards{display:flex;gap:8px;align-items:center}
.cslot{width:52px;height:70px;border-radius:10px;border:2px dashed var(--line);background:var(--field);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1;padding:0;flex:none}
.cslot.filled{border:1px solid var(--line);background:#fff;color:#191f28;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cslot.filled .s0,.mc.s0{color:#1f2937}
.cslot .su{font-size:18px;margin-top:4px}
.cslot .plus{color:var(--muted);font-size:22px;font-weight:600}
.board{display:flex;gap:14px;flex-wrap:wrap}
.bgrp .lbl{margin-bottom:6px}
.mc{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 4px;font-weight:800;font-size:13px;margin-right:2px;line-height:1.5}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:2px solid transparent;background:var(--field);border-radius:999px;padding:7px 12px;min-height:42px;font-weight:700;font-size:13px;color:var(--sub)}
.vchip small{font-weight:600;color:var(--muted);margin-left:4px}
.vchip.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-strong)}
.vchip:disabled{opacity:.35}
.vbox{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.vhead b{font-size:17px}
.vhead small{color:var(--muted);font-weight:600;margin-left:6px}
.seg.sm button{padding:6px 10px;font-size:12px}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input{flex:1;accent-color:var(--pri);height:30px;margin:0}
.pct{font-weight:800;font-size:19px;min-width:58px;text-align:right}
.rgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin-top:12px}
.rgrid button{aspect-ratio:1;border:0;border-radius:4px;padding:0;font-size:9px;font-weight:700;background:var(--field);color:var(--muted);letter-spacing:-.05em}
.rgrid button.in{background:var(--pri);color:#fff}
.mini{border:0;background:none;color:var(--pri-strong);font-weight:700;font-size:13px;padding:4px 0}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.eq-big{font-size:34px;font-weight:800;color:var(--pri-strong);letter-spacing:-.03em;line-height:1.2}
.eq-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--field);margin:12px 0 4px}
.eq-bar i{display:block;height:100%}
.erow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.erow:last-child{border-bottom:0;padding-bottom:0}
.erow b{font-size:15px}
.erow p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.erow .v{font-weight:800;font-size:16px;white-space:nowrap}
.erow.me b,.erow.me .v{color:var(--pri-strong)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* 카드 고르기 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.doclinks{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.docframe{display:block;width:100%;height:65vh;border:0;background:var(--card)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s}
.sheet.show{transform:none;visibility:visible}
.sheet:not(.show){visibility:hidden;transition:transform .22s,visibility 0s .22s}
.sheet-in{max-width:528px;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head b{font-size:18px}
.sheet-sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.rank-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.rank-grid button{height:48px;border:2px solid transparent;border-radius:12px;background:var(--field);font-size:18px;font-weight:800}
.rank-grid button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-strong)}
.rank-grid button:disabled{opacity:.25}
.suit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.suit-grid button{height:62px;border:2px solid transparent;border-radius:14px;background:var(--field);font-size:30px}
.suit-grid button:disabled{opacity:.18}
.sheet-foot{display:flex;justify-content:space-between;margin-top:14px}

/* 라인 */
.ante-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.ltabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.ltab{flex:none;border:2px solid transparent;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--sub);box-shadow:var(--shadow)}
.ltab.on{border-color:var(--pri);color:var(--pri-strong);background:var(--pri-soft)}
.ltab.add{color:var(--pri-strong);box-shadow:none;border:2px dashed var(--line);background:none}
.lst{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--sub);margin:14px 0 4px}
.lst span{margin-left:auto;font-weight:600;color:var(--muted);font-size:12px}
.lrow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--field);margin-bottom:4px}
.lrow.me{background:var(--pri-soft)}
.lrow.me .lpos,.lrow.me .ltxt{color:var(--pri-strong)}
.lrow.sys{background:none;padding:4px 10px;color:var(--muted)}
.lpos{font-weight:800;font-size:13px}
.ltxt{font-weight:700;font-size:14px}
.lpot{font-size:12px;color:var(--muted);font-weight:600}
.br{border:0;background:var(--field);color:var(--sub);font-size:12px;font-weight:700;padding:0 10px;min-height:36px;min-width:44px;border-radius:10px;white-space:nowrap}
.lend{margin-top:10px;padding:12px;border-radius:12px;background:var(--pri-soft);color:var(--pri-strong);font-weight:700;font-size:14px}
.ainfo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--field);border-radius:14px;padding:12px;margin-bottom:12px}
.ainfo div{display:flex;flex-direction:column}
.ainfo span{font-size:12px;color:var(--muted);font-weight:600}
.ainfo b{font-size:16px}
.abtns{display:flex;gap:8px}
.abtn{flex:1;border:0;border-radius:14px;height:52px;font-size:16px;font-weight:700;background:var(--field);color:var(--text)}
.abtn:active{background:var(--line)}
.abtn.fold{color:var(--neg)}
.abtn.pri{background:var(--pri);color:#fff;flex:none;padding:0 16px;min-width:110px}
.abtn.allin{width:100%;margin-top:10px;background:none;border:2px solid var(--line);color:var(--sub);height:46px;font-size:15px}
.raise{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.raise .lbl small{font-weight:500;color:var(--muted);margin-left:4px}
.raise .quick{margin:4px 0 10px}
.rrow2{display:flex;gap:8px;align-items:stretch}
.rrow2 .inp{flex:1}
.seg.wide{display:grid;grid-template-columns:1fr 1fr;margin-bottom:8px}
.seg.wide button{padding:9px 6px}
.lcard{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.lcard.best{border-color:var(--pri)}
.lc-head{display:flex;align-items:center;gap:8px}
.lc-head b{font-size:16px}
.badge2{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:auto}
.lc-ev{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}
.lc-sub{font-size:13px;color:var(--sub)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.lc-decs{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.dec{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.dec b{font-size:14px}
.dec p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.dv{font-weight:800;font-size:15px;white-space:nowrap}

/* 복기 리포트 */
.verdict{border-radius:22px;padding:20px;margin-bottom:12px;color:#fff;box-shadow:var(--shadow)}
.verdict.good{background:linear-gradient(135deg,#0e9f6e,#0a7453)}

/* ================= 언어 · 통화 ================= */
const LANGS = { ko: "한국어", ja: "日本語", en: "English" };
function detectLang(){ const l = (navigator.language || "ko").slice(0, 2); return LANGS[l] ? l : "en"; }
if (!LANGS[S.lang]) S.lang = detectLang();
const DEF_CUR = { ko: "KRW", ja: "JPY", en: "USD" };
const CUR_SYM = { KRW: "₩", JPY: "¥", USD: "$" };
const curCode = () => S.cur || DEF_CUR[S.lang];
// 번역: 한국어 문장을 열쇠로 써요. 번역이 없으면 한국어 그대로
function t(key, vars){
  let out = (S.lang !== "ko" && I18N[S.lang] && I18N[S.lang][key]) || key;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
  return out;
}
function money(n){
  const v = fmt(n), c = curCode();
  if (c === "KRW") return S.lang === "ko" ? v + "원" : "₩" + v;
  if (c === "JPY") return S.lang === "ja" ? v + "円" : "¥" + v;
  return "$" + v;
}
const chipWord = () => ({ ko: "칩", ja: "チップ", en: " chips" })[S.lang];
function lineName(name){
  if (name === "실제 라인") return t("실제 라인");
  const m = /^라인 ([A-Z])$/.exec(name);
  return m ? t("라인 {x}", { x: m[1] }) : name;
}

/* ================= 숫자 도우미 ================= */
const ok = v => typeof v === "number" && isFinite(v);
// "5만", "1.2억", "50k", "1,000" → 숫자
function parseNum(s){
  if (s == null) return NaN;
  s = String(s).replace(/[,\s원칩円¥₩$]|チップ|chips?/gi, "");
  if (!s) return NaN;
  let mult = 1;
  if (/[억億]$/.test(s)) { mult = 1e8; s = s.slice(0, -1); }
  else if (/[천千]$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  else if (/[만万]$/.test(s)) { mult = 1e4; s = s.slice(0, -1); }
  else if (/[mM]$/.test(s)) { mult = 1e6; s = s.slice(0, -1); }
  else if (/[kK]$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  if (!/^\d*\.?\d+$|^\d+\.?$/.test(s)) return NaN;
  return parseFloat(s) * mult;
}
const fmt = n => Math.round(n).toLocaleString("ko-KR");
const won = n => money(n);
function fmtShort(n){
  const a = Math.abs(n), sg = n < 0 ? "-" : "";
  const r = (x, d) => (x).toFixed(d).replace(/\.0+$/, "");
  if (S.lang === "en") return a >= 1e9 ? sg + r(a / 1e9, 1) + "B" : a >= 1e6 ? sg + r(a / 1e6, 1) + "M" : a >= 1e3 ? sg + r(a / 1e3, 1) + "K" : fmt(n);
  const [man, eok] = S.lang === "ja" ? ["万", "億"] : ["만", "억"];
  return a >= 1e8 ? sg + r(a / 1e8, 1) + eok : a >= 1e4 ? sg + r(a / 1e4, a >= 1e6 ? 0 : 1) + man : fmt(n);
}

/* ================= ICM 계산 ================= */
// Harville ICM: 한 사람의 상금 가치. 다른 테이블 인원은 모두 같은 스택이라고 봐요.
// (내가 "몇 등으로 끝나는지" 확률을 적분으로 정확하게 계산 — 시뮬레이션이 아니라 매번 같은 값)
function icmValue(stacks, idx, others, otherStack, prizes, M = 3000){
  const sh = stacks[idx], K = prizes.length;
  if (!(sh > 0)) return 0;
  const tbl = []; for (let j = 0; j < stacks.length; j++) if (j !== idx && stacks[j] > 0) tbl.push(stacks[j]);
  const d = new Float64Array(tbl.length + 1), b = new Float64Array(K);
  let ev = 0;
  for (let m = 0; m < M; m++) {
    const x = -Math.log(1 - (m + 0.5) / M) / sh;
    d.fill(0); d[0] = 1; let len = 1;
    for (const s of tbl) {
      const q = -Math.expm1(-s * x);
      for (let k = len; k >= 1; k--) d[k] = d[k] * (1 - q) + d[k - 1] * q;
      d[0] *= (1 - q); len++;
    }
    let val = 0;
    if (others > 0) {
      const p = -Math.expm1(-otherStack * x);
      b.fill(0);
      if (p <= 0) b[0] = 1;
      else if (p < 1) {
        let lp = others * Math.log1p(-p); const lr = Math.log(p) - Math.log1p(-p);
        for (let k = 0; k < K && k <= others; k++) { b[k] = Math.exp(lp); lp += Math.log((others - k) / (k + 1)) + lr; }
      }
      for (let k1 = 0; k1 < len && k1 < K; k1++) { if (!d[k1]) continue; let s2 = 0; for (let k2 = 0; k1 + k2 < K; k2++) s2 += b[k2] * prizes[k1 + k2]; val += d[k1] * s2; }
    } else {
      for (let k = 0; k < len && k < K; k++) val += d[k] * prizes[k];
    }
    ev += val;
  }
  return ev / M;
}

/* ================= 단계별 확인 ================= */
function validate(step){
  if (step === 1) {
    if (!ok(S.sb) || S.sb <= 0) return t("SB를 입력해주세요.");
    if (!ok(S.bb) || S.bb <= 0) return t("BB를 입력해주세요.");
    if (ok(S.ante) && S.ante < 0) return t("앤티를 확인해주세요.");
    if (!ok(S.total) || S.total < 2 || S.total % 1) return t("남은 인원은 2명 이상으로 입력해주세요.");
    if (!ok(S.avg) || S.avg <= 0) return t("에버리지 스택을 입력해주세요.");
    if (S.sb > S.bb) return t("SB가 BB보다 커요. 블라인드를 확인해주세요.");
    if (!S.groups.length) return t("상금을 한 개 이상 입력해주세요.");
    let r = 1;
    for (const g of S.groups) {
      if (!ok(g.a) || g.a < 0) return t("{r}위 상금을 입력해주세요.", { r });
      r += Math.max(1, Math.floor(g.c || 1));
    }
    if (r - 1 > S.total) return t("상금 순위({n}개)가 남은 인원({m}명)보다 많아요. 이미 지급된 순위는 빼주세요.", { n: r - 1, m: S.total });
    return null;
  }
  if (step === 2) {
    if (S.seatCount > S.total) return t("남은 인원({n}명)보다 테이블 인원이 많아요.", { n: S.total });
    return null;
  }
  if (step === 3) {
    for (let i = 0; i < S.seatCount; i++) if (!(stackOf(i) > 0)) return t("{p} 스택을 확인해주세요.", { p: positionsFor(S.seatCount)[i] });
    const others = S.total - S.seatCount;
    if (others > 0) {
      const tableChips = S.stacks.reduce((a, _, i) => a + stackOf(i), 0);
      if (S.total * S.avg - tableChips <= 0) return t("테이블 칩 합계가 전체 칩(남은 인원 × 에버리지)보다 많아요.");
    }
    return null;
  }
  if (step === 4) {
    cleanVillains();
    const hc = S.heroCards.filter(c => c != null).length;
    if (hc === 1) return t("내 핸드 2장을 모두 골라주세요.");
    const fc = S.board.slice(0, 3).filter(c => c != null).length;
    if (fc === 1 || fc === 2) return t("플랍은 3장을 모두 골라주세요.");
    if (S.board[3] != null && fc < 3) return t("턴 전에 플랍 3장을 먼저 골라주세요.");
    if (S.board[4] != null && S.board[3] == null) return t("리버 전에 턴을 먼저 골라주세요.");
    if (hc === 0) return null; // 핸드 없이 ICM만 보기
    if (!S.villains.length) return t("팟에 들어온 상대를 한 명 이상 골라주세요.");
    const pos = positionsFor(S.seatCount);
    for (const v of S.villains) {
      if (v.mode === "hand" && v.cards.some(c => c == null)) return t("{p} 핸드 2장을 모두 골라주세요.", { p: pos[v.seat] });
      if (v.mode === "range" && !rangeSet(v).size) return t("{p} 레인지가 비어 있어요.", { p: pos[v.seat] });
    }
    return null;
  }
  return null;
}
function goTo(n){
  if (n > S.step) {
    for (let k = S.step; k < n; k++) {
      const err = validate(k);
      if (err) { if (k !== S.step) { S.step = k; render(); } toast(err); return; }
    }
  }
  view = "calc"; S.step = n; save(); render(); window.scrollTo(0, 0);
}

/* ================= 카드 · 레인지 · 에퀴티 ================= */
const RANKS = "23456789TJQKA", SUITS = "♠♥♦♣";
const POS_PCT = { "UTG": 15, "UTG+1": 16, "UTG+2": 18, "LJ": 21, "HJ": 25, "CO": 31, "BTN": 45, "SB": 40, "BB": 55, "BTN/SB": 70 };
// 13x13 표 순서(왼쪽 위 AA, 오른쪽 위가 수티드)
const GRID = [];
for (let i = 0; i < 13; i++) for (let j = 0; j < 13; j++) {
  const hi = 12 - Math.min(i, j), lo = 12 - Math.max(i, j);
  GRID.push(i === j ? RANKS[hi] + RANKS[lo] : RANKS[hi] + RANKS[lo] + (j > i ? "s" : "o"));
}
const comboCount = name => name.length === 2 ? 6 : name[2] === "s" ? 4 : 12;
function combosOf(name){
  const hi = RANKS.indexOf(name[0]), lo = RANKS.indexOf(name[1]), out = [];
  for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
    if (name.length === 2) { if (a < b) out.push([hi * 4 + a, lo * 4 + b]); }
    else if (name[2] === "s" ? a === b : a !== b) out.push([hi * 4 + a, lo * 4 + b]);
  }
  return out;
}
function rangeFromPct(pct){
  const set = new Set(), target = pct / 100 * 1326;
  let cum = 0;
  for (const name of ORDER) { if (cum >= target - 0.5) break; set.add(name); cum += comboCount(name); }
  return set;
}
function rangeSet(v){
  if (v.custom) return new Set(GRID.filter((_, k) => v.custom[k] === "1"));
  return rangeFromPct(v.pct);
}
const rangeCombos = set => [...set].reduce((a, n) => a + comboCount(n), 0);
const cardHTML = c => `<span>${RANKS[c >> 2]}</span><span class="su s${c & 3}">${SUITS[c & 3]}</span>`;
const miniCard = c => `<span class="mc s${c & 3}">${RANKS[c >> 2]}${SUITS[c & 3]}</span>`;

// 7장 중 가장 좋은 5장 족보를 숫자로 (클수록 강함)
function straightHigh(m){
  const mm = (m << 1) | ((m >> 12) & 1);
  for (let h = 13; h >= 4; h--) if (((mm >> (h - 4)) & 31) === 31) return h - 1;
  return -1;
}
function topRanks(m, k, excl){ let v = 0, n = 0; for (let r = 12; r >= 0 && n < k; r--) if ((m >> r) & 1 && !((excl >> r) & 1)) { v = (v << 4) | r; n++; } return v; }
const EV_RC = new Int8Array(13), EV_SC = new Int8Array(4), EV_SM = new Int32Array(4);
function evalHand(cs){
  const rc = EV_RC, sc = EV_SC, sm = EV_SM;
  rc.fill(0); sc.fill(0); sm.fill(0);
  let mask = 0;
  for (let i = 0; i < cs.length; i++) { const c = cs[i], r = c >> 2, s = c & 3; rc[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
  for (let s = 0; s < 4; s++) if (sc[s] >= 5) {
    const sf = straightHigh(sm[s]);
    return sf >= 0 ? (8 << 20) | sf : (5 << 20) | topRanks(sm[s], 5, 0);
  }
  let quad = -1, t1 = -1, t2 = -1, p1 = -1, p2 = -1;
  for (let r = 12; r >= 0; r--) {
    const c = rc[r];
    if (c === 4) quad = r;
    else if (c === 3) { if (t1 < 0) t1 = r; else if (t2 < 0) t2 = r; }
    else if (c === 2) { if (p1 < 0) p1 = r; else if (p2 < 0) p2 = r; }
  }
  if (quad >= 0) return (7 << 20) | (quad << 4) | topRanks(mask, 1, 1 << quad);
  if (t1 >= 0 && (t2 >= 0 || p1 >= 0)) return (6 << 20) | (t1 << 4) | Math.max(t2, p1);
  const st = straightHigh(mask);
  if (st >= 0) return (4 << 20) | st;
  if (t1 >= 0) return (3 << 20) | (t1 << 8) | topRanks(mask, 2, 1 << t1);
  if (p2 >= 0) return (2 << 20) | (p1 << 8) | (p2 << 4) | topRanks(mask, 1, (1 << p1) | (1 << p2));
  if (p1 >= 0) return (1 << 20) | (p1 << 12) | topRanks(mask, 3, 1 << p1);
  return topRanks(mask, 5, 0);
}

// 에퀴티: 끝까지 갔을 때 각자 팟을 가져가는 몫
function equityCalc(heroCards, villains, board, onProgress){
  return new Promise(resolve => {
    const dead = new Set([...heroCards, ...board]);
    villains.forEach(v => v.mode === "hand" && v.cards.forEach(c => dead.add(c)));
    const players = villains.map(v => {
      if (v.mode === "hand") return { fixed: v.cards.slice() };
      const combos = [];
      for (const name of rangeSet(v)) for (const cb of combosOf(name)) if (!dead.has(cb[0]) && !dead.has(cb[1])) combos.push(cb);
      return { combos };
    });
    if (players.some(p => p.combos && !p.combos.length)) return resolve({ error: t("상대 레인지에 가능한 핸드가 없어요. (내 카드·보드와 모두 겹쳐요)") });
    const nP = players.length + 1, share = new Float64Array(nP);
    const need = 5 - board.length;
    const allFixed = players.every(p => p.fixed);
    const deck = []; for (let c = 0; c < 52; c++) if (!dead.has(c)) deck.push(c);
    const hands = new Array(nP), scores = new Array(nP), used = new Uint8Array(52);
    const b = board.slice(); for (let i = 0; i < 5; i++) if (b[i] == null) b[i] = -1;
    hands[0] = heroCards;
    function score(){
      let best = -1, cnt = 0;
      for (let p = 0; p < nP; p++) {
        const s = evalHand([hands[p][0], hands[p][1], b[0], b[1], b[2], b[3], b[4]]);
        scores[p] = s; if (s > best) { best = s; cnt = 1; } else if (s === best) cnt++;
      }
      for (let p = 0; p < nP; p++) if (scores[p] === best) share[p] += 1 / cnt;
    }
    // 모든 핸드를 알고 남은 카드가 2장 이하면: 모든 경우를 다 계산
    if (allFixed && need <= 2) {
      players.forEach((p, i) => hands[i + 1] = p.fixed);
      let trials = 0;
      if (need === 0) { score(); trials = 1; }
      else if (need === 1) { for (const c of deck) { b[4] = c; score(); trials++; } }
      else { for (let x = 0; x < deck.length; x++) for (let y = x + 1; y < deck.length; y++) { b[3] = deck[x]; b[4] = deck[y]; score(); trials++; } }
      return resolve({ share: Array.from(share, v => v / trials), trials, exact: true });
    }
    const TRIALS = 60000; let tr = 0, done = 0;
    (function run(){
      const end = Math.min(TRIALS, tr + 15000);
      while (tr < end) {
        tr++;
        used.fill(0);
        let okDeal = true;
        for (let i = 0; i < players.length && okDeal; i++) {
          const p = players[i];
          if (p.fixed) { hands[i + 1] = p.fixed; used[p.fixed[0]] = used[p.fixed[1]] = 1; continue; }
          let tries = 0, cb;
          do { cb = p.combos[(Math.random() * p.combos.length) | 0]; } while ((used[cb[0]] || used[cb[1]]) && ++tries < 60);
          if (used[cb[0]] || used[cb[1]]) { okDeal = false; break; }
          hands[i + 1] = cb; used[cb[0]] = used[cb[1]] = 1;
        }
        if (!okDeal) continue;
        for (let k = 5 - need; k < 5; k++) {
          let c; do { c = deck[(Math.random() * deck.length) | 0]; } while (used[c]);
          used[c] = 1; b[k] = c;
        }
        score(); done++;
      }
      onProgress && onProgress(tr / TRIALS);
      if (tr < TRIALS) nextTick().then(run);
      else resolve(done ? { share: Array.from(share, v => v / done), trials: done, exact: false } : { error: t("상대 두 명의 레인지가 서로 겹쳐서 계산할 수 없어요.") });
    })();
  });
}

/* ================= 핸드 진행 엔진 ================= */
const STREETS_KO = ["프리플랍", "플랍", "턴", "리버"];
const STREETS = new Proxy([], { get: (o, k) => k === "length" ? 4 : (/^\d$/.test(k) ? t(STREETS_KO[+k]) : o[k]) });
function blindSeats(n){ return n === 2 ? [0, 1] : [n - 2, n - 1]; }
function orderFor(n, street){
  if (n === 2) return street === 0 ? [0, 1] : [1, 0];
  const a = [...Array(n).keys()];
  return street === 0 ? a : [n - 2, n - 1, ...a.slice(0, n - 2)];
}
const potOf = H => H.commit.reduce((a, b) => a + b, 0) + H.dead;
const cloneH = H => JSON.parse(JSON.stringify(H));
function handCfg(){
  cleanVillains();
  return { n: S.seatCount, sb: S.sb, bb: S.bb, ante: ok(S.ante) ? S.ante : 0, anteType: S.anteType,
    stacks: Array.from({ length: S.seatCount }, (_, i) => stackOf(i)), parts: [S.hero, ...S.villains.map(v => v.seat)] };
}
function newHand(cfg){
  const n = cfg.n;
  const H = { n, bb: cfg.bb, parts: cfg.parts.slice(), start: cfg.stacks.slice(), stack: cfg.stacks.slice(),
    commit: Array(n).fill(0), bet: Array(n).fill(0), folded: Array(n).fill(true), allin: Array(n).fill(false),
    dead: 0, street: 0, cur: 0, lastRaise: cfg.bb, acted: [], pos: -1, toAct: null, end: null, aggr: null };
  cfg.parts.forEach(p => H.folded[p] = false);
  const [sbS, bbS] = blindSeats(n);
  if (cfg.ante > 0) {
    const payers = cfg.anteType === "each" ? [...Array(n).keys()] : [bbS];
    for (const i of payers) { const a = Math.min(cfg.ante, H.stack[i]); H.stack[i] -= a; H.dead += a; }
  }
  const post = (i, amt) => { const a = Math.min(amt, H.stack[i]); H.stack[i] -= a; H.bet[i] += a; H.commit[i] += a; };
  post(sbS, cfg.sb); post(bbS, cfg.bb);
  H.cur = Math.max(...H.bet);
  cfg.parts.forEach(p => { if (H.stack[p] <= 0) H.allin[p] = true; });
  advance(H);
  return H;
}
function needsAct(H, i){ return !H.folded[i] && !H.allin[i] && (H.bet[i] < H.cur || !H.acted.includes(i)); }
function advance(H){
  for (let guard = 0; guard < 8; guard++) {
    const live = H.parts.filter(i => !H.folded[i]);
    if (live.length === 1) { H.toAct = null; H.end = { type: "fold", winner: live[0] }; return; }
    const order = orderFor(H.n, H.street);
    const canAct = live.filter(i => !H.allin[i]);
    if (!(canAct.length === 1 && H.bet[canAct[0]] >= H.cur && H.acted.length === 0 && H.street > 0)) {
      for (let k = 1; k <= H.n; k++) {
        const i = order[(H.pos + k + H.n) % H.n];
        if (H.parts.includes(i) && needsAct(H, i)) {
          if (canAct.length === 1 && H.bet[i] >= H.cur) break;
          H.toAct = i; return;
        }
      }
    }
    H.toAct = null;
    if (H.street === 3 || canAct.length <= 1) { H.end = { type: "showdown" }; return; }
    H.street++; H.bet.fill(0); H.cur = 0; H.lastRaise = H.bb; H.acted = []; H.pos = -1; H.aggr = null;
  }
}
function applyAct(H, act){
  const i = act.p;
  if (H.end || i !== H.toAct) return t("지금은 이 사람 차례가 아니에요.");
  const toCall = H.cur - H.bet[i];
  const put = amt => { const x = Math.min(amt, H.stack[i]); H.stack[i] -= x; H.bet[i] += x; H.commit[i] += x; if (H.stack[i] <= 0) H.allin[i] = true; };
  if (act.a === "f") H.folded[i] = true;
  else if (act.a === "x") { if (toCall > 0) return t("콜할 금액이 있어서 체크할 수 없어요."); }
  else if (act.a === "c") { if (toCall <= 0) return t("콜할 금액이 없어요."); put(toCall); }
  else if (act.a === "r") {
    const max = H.bet[i] + H.stack[i], to = Math.min(act.to, max);
    if (!(to > 0)) return t("금액을 입력해주세요.");
    if (to <= H.cur) { if (to === max && toCall > 0) put(toCall); else return t("{x}보다 크게 입력해주세요.", { x: stackText(H.cur) }); }
    else {
      const minTo = H.cur + H.lastRaise;
      if (to < minTo - 1e-6 && to !== max) return t("최소 {x}까지는 올려야 해요.", { x: stackText(minTo) });
      if (to - H.cur >= H.lastRaise) H.lastRaise = to - H.cur;
      H.cur = to; put(to - H.bet[i]); H.acted = []; H.aggr = i;
    }
  } else return t("알 수 없는 액션이에요.");
  H.acted.push(i);
  H.pos = orderFor(H.n, H.street).indexOf(i);
  advance(H);
  return null;
}
function replay(cfg, acts){
  const H = newHand(cfg), snaps = [], log = [];
  let err = null;
  for (const a of acts) {
    const before = cloneH(H);
    err = applyAct(H, a);
    if (err) break;
    snaps.push(before);
    log.push({ act: a, before, betAfter: before.bet[a.p] + (before.stack[a.p] - H.stack[a.p]), allin: H.allin[a.p] });
  }
  return { H, snaps, log, valid: log.length, err };
}
function potSlices(H){
  const live = H.parts.filter(i => !H.folded[i]);
  const lv = [...new Set(live.map(i => H.commit[i]))].sort((a, b) => a - b);
  let prev = 0; const slices = [];
  for (const L of lv) {
    let amt = 0;
    for (let i = 0; i < H.n; i++) amt += Math.max(0, Math.min(H.commit[i], L) - Math.min(H.commit[i], prev));
    slices.push({ amt, elig: live.filter(i => H.commit[i] >= L) });
    prev = L;
  }
  let extra = 0; for (let i = 0; i < H.n; i++) extra += Math.max(0, H.commit[i] - prev);
  slices[slices.length - 1].amt += extra;
  slices[0].amt += H.dead;
  return slices;
}
// 쇼다운 결과 분포: [{p, fs(최종 스택)}]
function showdownDist(H, specs, board, dead, trials){
  const live = H.parts.filter(i => !H.folded[i]);
  const slices = potSlices(H);
  const deadSet = new Set([...board, ...dead]);
  live.forEach(i => specs[i].fixed && specs[i].fixed.forEach(c => deadSet.add(c)));
  const ps = live.map(i => specs[i].fixed ? { fixed: specs[i].fixed } : { combos: specs[i].combos.filter(cb => !deadSet.has(cb[0]) && !deadSet.has(cb[1])) });
  if (ps.some(p => p.combos && !p.combos.length)) return { error: t("상대 레인지에 가능한 핸드가 없어요.") };
  const deck = []; for (let c = 0; c < 52; c++) if (!deadSet.has(c)) deck.push(c);
  const need = 5 - board.length, b = [...board, -1, -1, -1, -1, -1].slice(0, 5);
  const hands = new Array(live.length), sc = new Array(live.length), used = new Uint8Array(52), win = new Float64Array(H.n);
  const map = new Map(); let total = 0;
  function settle(){
    for (let k = 0; k < live.length; k++) sc[k] = evalHand([hands[k][0], hands[k][1], b[0], b[1], b[2], b[3], b[4]]);
    win.fill(0);
    for (const s of slices) {
      let best = -1, cnt = 0;
      for (const i of s.elig) { const v = sc[live.indexOf(i)]; if (v > best) { best = v; cnt = 1; } else if (v === best) cnt++; }
      for (const i of s.elig) if (sc[live.indexOf(i)] === best) win[i] += s.amt / cnt;
    }
    const key = live.map(i => Math.round(win[i])).join(",");
    const e = map.get(key); if (e) e.w++; else map.set(key, { w: 1, win: Array.from(win) });
    total++;
  }
  const exact = ps.every(p => p.fixed) && need <= 2;
  if (exact) {
    ps.forEach((p, k) => hands[k] = p.fixed);
    if (need === 0) settle();
    else if (need === 1) for (const c of deck) { b[4] = c; settle(); }
    else for (let x = 0; x < deck.length; x++) for (let y = x + 1; y < deck.length; y++) { b[3] = deck[x]; b[4] = deck[y]; settle(); }
  } else {
    const firstRange = ps.findIndex(p => p.combos);
    for (let t = 0; t < trials; t++) {
      used.fill(0); let okd = true;
      for (let k = 0; k < ps.length; k++) {
        const p = ps[k];
        if (p.fixed) { hands[k] = p.fixed; continue; }
        let tries = 0, cb;
        // 첫 번째 레인지는 모든 조합을 골고루 돌아가며 써서 오차를 줄여요
        if (k === firstRange) cb = p.combos[t % p.combos.length];
        else do { cb = p.combos[(Math.random() * p.combos.length) | 0]; } while ((used[cb[0]] || used[cb[1]]) && ++tries < 60);
        if (used[cb[0]] || used[cb[1]]) { okd = false; break; }
        hands[k] = cb; used[cb[0]] = used[cb[1]] = 1;
      }
      if (!okd) continue;
      for (let k = 5 - need; k < 5; k++) { let c; do { c = deck[(Math.random() * deck.length) | 0]; } while (used[c]); used[c] = 1; b[k] = c; }
      settle();
    }
  }
  if (!total) return { error: t("상대 두 명의 레인지가 서로 겹쳐서 계산할 수 없어요.") };
  return { outs: [...map.values()].map(e => ({ p: e.w / total, fs: H.stack.map((s, i) => s + e.win[i]) })), exact, n: total };
}

function actText(entry){

}
function sizeOptions(H, i){
  const pot = potOf(H), toCall = H.cur - H.bet[i], minTo = H.cur + H.lastRaise, max = H.bet[i] + H.stack[i], BB = S.bb;
  let out = [];

  out = out.map(([l, to]) => [l, Math.round(to)]).filter(([, to]) => to >= minTo && to < max);
  return out;
}

      const txt = a.act.a === "f" ? t("폴드") : a.act.a === "x" ? t("체크") : a.act.a === "c" ? t("콜") : `${a.act.to >= d.snap.bet[S.hero] + d.snap.stack[S.hero] ? t("올인") : t("레이즈")} ${stackText(Math.min(a.act.to, d.snap.bet[S.hero] + d.snap.stack[S.hero]))}`;
      const ar = evalAt(a.li, st);
      if (ok(ar.ev)) list.push({ label: `${lineName(a.name)} · ${txt}`, short: txt, ev: ar.ev, se: ar.se });
      else list.push({ label: `${lineName(a.name)} · ${txt}`, short: txt, ev: null, note: ar.incomplete ? t("라인이 아직 안 끝났어요") : ar.error || "" });
    });
    const valid = list.filter(x => ok(x.ev));
    const bestAlt = valid.length ? valid.reduce((a, b) => (b.ev > a.ev ? b : a)) : null;
    const raw = bestAlt ? mine.ev - bestAlt.ev : null;
    const noise = bestAlt ? 2 * Math.sqrt((mine.se || 0) ** 2 + (bestAlt.se || 0) ** 2) : 0;
    const close = raw != null && Math.abs(raw) < Math.max(noise, 10);
    const info = allinInfo(mine, mine.decisions.find(x => x.k === d.k), cb);
    const fe = foldInfo(mine, d, st, bestAlt);
    if (!callInfo && d.toCall > 0 && d.e.act.a === "c") callInfo = mine.outs ? callNeedInfo(mine, d) : null;
    return { d, st, reliable, list, bestAlt, impact: close ? 0 : raw, close, info: callInfo ? null : info, callInfo, fe, mineEV: mine.ev, mineSE: mine.se || 0 };
  });
  return { r, items };
}

// 결론 카드 계산 (화면과 공유 이미지가 같이 써요)
function verdictData(D){
  if (!D) return null;
  const h = S.hero, rel = D.items.filter(x => x.reliable), judged = rel.filter(x => x.impact != null);
  const base = lastRes.eq[h], A = lastRes.actual, hasActual = A && ok(A.v);
  const anchor = rel[0] || D.items[D.items.length - 1], expect = anchor.mineEV;
  const badList = judged.filter(x => x.impact < -10);
  const decVal = !judged.length ? null : badList.length ? badList.reduce((a, x) => a + x.impact, 0) : judged[judged.length - 1].impact;
  const luck = hasActual ? A.v - expect : null, res = hasActual ? A.v - base : null;
  const good = decVal != null && !badList.length;
  let title, text, tone;
  if (decVal == null) {
    title = t("판단할 수 있는 결정이 없어요"); tone = "neutral";
    text = t("마지막 결정과 비교할 다른 선택이 없어요. 라인 화면에서 <b>↳ 다르게</b>로 다른 선택을 만들어보세요.");
  } else {
    const worst = badList.slice().sort((a, b) => a.impact - b.impact)[0];
    const where = worst ? t("{s} {a}에서 {x} 손해", { s: STREETS[worst.st], a: actText(worst.d.e), x: won(round3(-worst.impact)) }) : "";
    if (hasActual && Math.abs(luck) < 10) { title = good ? t("결정이 좋았어요") : t("결정에 손해가 있었어요"); tone = good ? "good" : "bad"; text = good ? t("운이 끼어들 여지가 없는 결정이었고, ICM까지 따져봤을 때 가장 좋은 선택이었어요.") : t("{w}가 있었어요.", { w: where }); }
    else if (!hasActual) { title = good ? t("결정은 좋았어요") : t("결정에 손해가 있었어요"); tone = good ? "good" : "bad"; text = good ? t("믿을 수 있는 결정들이 모두 가장 좋은 선택이거나 비슷했어요.") : t("{w}가 있었어요.", { w: where }); }
    else if (good && res >= 0) { title = t("결정도 좋고, 결과도 좋았어요"); tone = "good"; text = luck < -10 ? t("기대값보다는 조금 덜 벌었지만, 좋은 선택이 + 결과로 이어졌어요.") : t("좋은 선택이 좋은 결과로 이어졌어요."); }
    else if (good) { title = t("결과는 나빴지만, 결정은 좋았어요"); tone = "good"; text = t("운이 나빴던 핸드예요. 같은 상황이 오면 같은 선택을 해도 돼요."); }
    else if (res >= 0) { title = t("결과는 좋았지만, 결정은 −였어요"); tone = "bad"; text = luck > 10 ? t("운이 좋았던 핸드예요. {w}가 있었어요.", { w: where }) : t("{w}가 있었어요.", { w: where }); }
    else { title = t("결정도 −, 결과도 −"); tone = "bad"; text = t("{w}가 있었어요.", { w: where }); }
  }
  return { title, text, tone, decVal, luck, res, hasActual, A, anchor, badList, refs: D.items.some(x => !x.reliable) };
}

// 공유용 세로 카드 이미지 그리기 (1080×1350)
function drawShareCard(){
  const W = 1080, H = 1350, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d"), C = lastRes.ctx, h = S.hero, pos = positionsFor(S.seatCount);
  const FONT = '"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans KR", "Noto Sans JP", sans-serif';
  const font = (w, s) => { g.font = `${w} ${s}px ${FONT}`; };
  const strip = s => String(s).replace(/<[^>]+>/g, "");
  // 줄바꿈: 일본어는 글자 단위, 한국어·영어는 띄어쓰기 단위
  const wrap = (txt, x, y, maxW, lh, maxLines = 3) => {
    const units = S.lang === "ja" ? [...strip(txt)] : strip(txt).split(/(?<= )/);
    let line = "", lines = 0;
    for (const u of units) {
      const test = line + u;
      if (g.measureText(test.trimEnd()).width > maxW && line) {
        if (lines === maxLines - 1) {
          let cut = line.trimEnd(); while (cut && g.measureText(cut + "…").width > maxW) cut = cut.slice(0, -1);
          g.fillText(cut + "…", x, y); return y + lh;
        }
        g.fillText(line.trimEnd(), x, y); y += lh; lines++; line = u.trimStart();
      } else line = test;
    }
    if (line) { g.fillText(line.trimEnd(), x, y); y += lh; }
    return y;
  };
  const rr = (x, y, w, hh, r, fill) => { g.beginPath(); g.roundRect(x, y, w, hh, r); g.fillStyle = fill; g.fill(); };
  const V = verdictData(lastRes.D);
  const tone = V ? V.tone : "neutral";
  // 배경
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, tone === "bad" ? "#3d1512" : "#0b3d2c"); bg.addColorStop(1, "#0b0f12");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // 머리말
  rr(72, 72, 76, 76, 22, "#0e9f6e");
  g.fillStyle = "#fff"; font(800, 46); g.textBaseline = "middle"; g.textAlign = "center"; g.fillText("♠", 110, 112);
  g.textAlign = "left"; font(800, 44); g.fillText(t("ICM 계산기"), 172, 112);
  g.textBaseline = "alphabetic";
  // 상황 요약
  const N = S.total, paid = C.prizes.length;
  const stage = N > paid ? t("인머니까지 {n}명 남음", { n: N - paid }) : N <= S.seatCount ? t("파이널 테이블") : t("인머니 진입");
  font(600, 34); g.fillStyle = "rgba(255,255,255,.72)";
  g.fillText(`${t("남은 {n}명", { n: N })} · ${stage}`, 72, 230);
  font(800, 52); g.fillStyle = "#fff";
  g.fillText(`${pos[h]} · ${stackText(C.stacks[h])}`, 72, 300);
  // 카드
  let cx = 72;
  const drawCard = (c, x, y, w, hh, fs) => {
    rr(x, y, w, hh, 14, "#fff");
    const col = ["#1f2937", "#e5484d", "#2f6fed", "#0e9f6e"][c & 3];
    g.fillStyle = col; font(800, fs); g.textAlign = "center";
    g.fillText(RANKS[c >> 2], x + w / 2, y + hh * 0.48);
    font(700, fs * 0.8); g.fillText(SUITS[c & 3], x + w / 2, y + hh * 0.88);
    g.textAlign = "left";
  };
  let y = 340;
  if (S.heroCards.every(c => c != null)) { S.heroCards.forEach(c => { drawCard(c, cx, y, 96, 130, 56); cx += 108; }); }
  const villains = S.villains.map(v => pos[v.seat]).join(", ");
  if (villains) { font(700, 36); g.fillStyle = "rgba(255,255,255,.8)"; g.fillText(`vs ${villains}`, cx + 20, y + 80); }
  const board = S.board.filter(c => c != null);
  if (board.length) { let bx = W - 72 - board.length * 82 + 10; board.forEach(c => { drawCard(c, bx, y + 22, 72, 98, 40); bx += 82; }); }
  // 결론
  y = 540;
  rr(56, y, W - 112, 520, 36, "rgba(255,255,255,.08)");
  const icon = tone === "good" ? "👍" : tone === "bad" ? "🤔" : "💡";
  g.fillStyle = "#fff"; font(800, 54);
  let ty = wrap(`${icon} ${V ? V.title : t("핸드 전 내 칩의 상금 가치")}`, 100, y + 92, W - 200, 66, 2);
  font(500, 34); g.fillStyle = "rgba(255,255,255,.8)";
  ty = wrap(V ? V.text : won(lastRes.eq[h]), 100, ty + 6, W - 200, 46, 2);
  // 숫자 3개
  const sy = Math.max(ty + 30, y + 300), cw = (W - 200) / 3;
  const cells = V ? [
    [t("결정의 가치"), V.decVal != null ? sgnWon(V.decVal) : "-", V.decVal],
    [t("운"), V.hasActual ? sgnWon(V.luck) : "-", V.luck],
    [t("실제 결과"), V.hasActual ? sgnWon(V.res) : "-", V.res],
  ] : [[t("내 스택"), stackText(C.stacks[h]), 0], [t("칩 비율"), pct(C.stacks[h] / C.totalChips), 0], [t("상금 비율"), pct(lastRes.eq[h] / C.prizes.reduce((a, b) => a + b, 0)), 0]];
  cells.forEach(([lab, val, num], i) => {
    const x = 100 + i * cw;
    font(600, 30); g.fillStyle = "rgba(255,255,255,.65)"; g.fillText(lab, x, sy);
    font(800, 42); g.fillStyle = num == null || Math.abs(num) < 10 ? "#fff" : num > 0 ? "#46d49f" : "#ff8a8d";
    wrap(val, x, sy + 58, cw - 16, 48, 1);
  });
  if (V && V.anchor) { font(500, 28); g.fillStyle = "rgba(255,255,255,.55)"; wrap(t("판단 기준: {s} {a}부터", { s: STREETS[V.anchor.st], a: actText(V.anchor.d.e) }), 100, y + 480, W - 200, 36, 1); }
  // 핵심 결정 한 줄
  const D = lastRes.D;
  const key = D && (D.items.filter(x => x.reliable && x.impact != null).slice(-1)[0]);
  if (key) {
    font(700, 36); g.fillStyle = "#fff";
    const verdict = key.close ? t("≈ 비슷해요") : key.impact >= -10 ? `${t("✓ 최선")}` : t("✗ {x} 손해", { x: won(round3(-key.impact)) });
    wrap(`${STREETS[key.st]} ${actText(key.d.e)} → ${verdict}`, 72, 1140, W - 144, 46, 1);
    if (key.callInfo) { font(500, 30); g.fillStyle = "rgba(255,255,255,.75)"; wrap(strip(t("콜에 필요한 승률 · ICM 기준 <b>{a}</b> · 칩으로만 보면 <b>{b}</b>", { a: pct(key.callInfo.need), b: pct(key.callInfo.chipNeed) })), 72, 1188, W - 144, 40, 1); }
    else if (key.fe && key.fe.be != null && key.fe.be > 0 && key.fe.be < 100) { font(500, 30); g.fillStyle = "rgba(255,255,255,.75)"; wrap(strip(t("{a}보다 나으려면 상대가 <b>{p}%</b> 이상 접어야 해요.", { a: key.bestAlt ? key.bestAlt.short : "", p: Math.round(key.fe.be) })), 72, 1188, W - 144, 40, 1); }
  }
  // 바닥 워터마크
  g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, H - 96, W, 96);
  font(700, 30); g.fillStyle = "rgba(255,255,255,.85)";
  const host = /^https?:/.test(location.protocol) ? location.host : "";
  g.fillText(`♠ ${t("ICM 계산기")}${host ? " · " + host : ""}`, 72, H - 36);
  return cv;
}
async function shareResult(){
  let cv;
  try { cv = drawShareCard(); } catch (e) { return toast(t("이미지를 만들지 못했어요.")); }
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  if (!blob) return toast(t("이미지를 만들지 못했어요."));
  // 앱(안드로이드)에서는 기기 공유창으로
  const P = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins;
  if (P && P.Filesystem && P.Share) {
    try {
      const data = cv.toDataURL("image/png").split(",")[1];
      const w = await P.Filesystem.writeFile({ path: "icm-result.png", data, directory: "CACHE" });
      await P.Share.share({ files: [w.uri], title: t("ICM 계산기") });
    } catch (e) { if (!/cancel/i.test(String(e && e.message))) toast(t("이미지를 만들지 못했어요.")); }
    return;
  }
  const file = new File([blob], "icm-result.png", { type: "image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: t("ICM 계산기") }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  // 공유창이 안 되면 파일로 저장
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = "icm-result.png"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t("이미지를 저장했어요."));
}

function decisionSection(D){

    const any = rel.some(x => x.impact != null);
    const head = !rel.length ? `<span class="muted">${t("참고")}</span>` : !any ? `<span class="muted">${t("비교 없음")}</span>` : lost < 0 ? `<span class="neg">${t("{x} 놓침", { x: won(round3(-lost)) })}</span>` : `<span class="pos">${t("✓ 최선")}</span>`;
    return `
      <div class="sgrp">
        <div class="sg-head"><b>${STREETS[st]}</b>${head}</div>

            </div>
            <div class="alt me"><span>${t("이렇게 했을 때 (실제)")}</span><span>${won(round4(mineEV))}</span></div>
            ${list.map(x => `<div class="alt"><span>${x.label}${x.note ? `<small>${x.note}</small>` : ""}</span>${ok(x.ev) ? `<span>${won(round4(x.ev))} <em class="${cls(x.ev - mineEV)}">${sgnWon(x.ev - mineEV)}</em></span>` : "<span>-</span>"}</div>`).join("")}
            ${reliable && close ? `<p class="help" style="margin:6px 0 0">${t("가장 좋은 다른 선택({a})과 차이가 오차 범위 안이라, 어느 쪽이 낫다고 말하기 어려워요.", { a: bestAlt.short })}</p>` : ""}
            ${reliable && !list.length ? `<p class="help" style="margin:6px 0 0">${t("다른 선택과 비교하려면 라인 화면에서 이 액션 옆 <b>↳ 다르게</b>를 눌러 라인을 만들어보세요.")}</p>` : ""}
            ${fe ? feHTML(fe, bestAlt) : ""}
            ${callInfo ? callInfoHTML(callInfo) : ""}
            ${info ? `<div class="eqline">${t("콜 받았을 때 내 승률 <b>{p}</b>", { p: pct(info.eq) })} · ${t("{b}보다 나으려면 필요한 승률 <b>{n}</b>", { b: info.base, n: pct(info.need) })}
              <span class="${info.eq >= info.need ? "pos" : "neg"}">${info.eq >= info.need ? t("→ 충분해요") : t("→ 부족해요")}</span></div>` : ""}
          </div>`).join("")}
      </div>`;
  }).join("");
  return `
    <section class="card">
      <h2>${t("스트리트별 내 결정")}</h2>
      <p class="help" style="margin:-8px 0 12px">${t("각 선택을 폴드, 그리고 직접 만든 다른 라인과 비교해요. 금액은 모두 상금 기준 기대값이고, 상대 핸드는 모른다고 보고(레인지) 계산해요.")}</p>
      ${D.items.some(x => !x.reliable) ? `<p class="refnote"><b>${t("참고")}</b> ${t("이후 스트리트의 내 행동을 모든 카드에서 똑같다고 보고 계산한 값이에요. 드로우·커넥터처럼 맞았을 때만 크게 이기는 핸드는 낮게 나올 수 있어요.")}</p>` : ""}

}

// 각 라인을 "실제 라인과 갈라지는 스트리트" 기준으로 실제 라인과 비교
function linesSection(){
  const L = lastRes.lines;
  if (!L || L.length < 2 || !L.some((x, k) => k > 0 && !x.r.empty)) return "";
  const acts = S.lines[0].acts, R0 = replay(handCfg(), acts);
  const rows = L.map(({ line, r }, k) => {
    if (k === 0 || r.empty) return "";
    let d = 0; while (d < acts.length && sameAct(acts[d], line.acts[d])) d++;
    const st = d < R0.log.length ? R0.log[d].before.street : R0.H.street;
    const who = d < line.acts.length ? positionsFor(S.seatCount)[line.acts[d].p] : "";
    const mine = evalAt(0, st), rr = evalAt(k, st);
    const val = ok(rr.ev) && ok(mine.ev)
      ? `<b>${won(round4(rr.ev))}</b><em class="${cls(rr.ev - mine.ev)}">${sgnWon(rr.ev - mine.ev)}</em>`
      : `<span class="muted">${rr.incomplete ? t("아직 안 끝남") : rr.error || "-"}</span>`;
    return `<div class="lsum"><span>${lineName(line.name)}<small class="lsub">${t("{s}에서 갈라짐", { s: STREETS[st] })}${who ? ` · ${who}` : ""} · ${t("실제")} ${ok(mine.ev) ? won(round4(mine.ev)) : "-"}</small></span><span>${val}</span></div>`;
  }).join("");
  return `
    <section class="card">
      <h2>${t("라인 한눈에 비교")}</h2>
      ${rows}
      <p class="help">${t("각 라인이 실제 라인과 갈라지는 스트리트 시점에서, 같은 기준으로 실제 라인과 비교한 판단 기준 기대값이에요.")}</p>
    </section>`;
}

function result(){
  const D = buildDecisions();
  lastRes.D = D;
  const R = lastRes, C = R.ctx, n = S.seatCount, N = S.total, pos = positionsFor(n), h = S.hero;
  const pool = C.prizes.reduce((a, b) => a + b, 0);
  const heroEq = R.eq[h], fair = pool * C.stacks[h] / C.totalChips, diff = heroEq - fair;
  const paid = C.prizes.length, maxEq = Math.max(...R.eq);
  const method = C.others > 0 ? t("다른 테이블 평균 가정") : t("정확 계산");
  const first = R.lines[0];
  const lineErr = first && (first.r.error || first.r.incomplete) ? `<section class="card"><h2>${t("라인")}</h2><p class="help" style="margin:0;color:var(--neg)">${first.r.incomplete ? t("실제 라인이 아직 끝나지 않았어요. 라인 화면에서 핸드 끝까지 넣어주세요.") : first.r.error}</p></section>` : "";

  let status = "";
  if (N > paid) status += row("🫧", t("인머니까지 {n}명 남음", { n: N - paid }), t("{n}명이 더 탈락하면 최소 {x}을 받아요.", { n: N - paid, x: won(C.prizes[paid - 1]) }));
  else if (N >= 2) status += row("💰", t("인머니 진입"), t("지금 탈락하면 {a} · 한 명만 더 버티면 {b}", { a: won(C.prizes[N - 1]), b: won(C.prizes[N - 2]) }) + ` <b style="display:inline;color:var(--pos)">(+${won(C.prizes[N - 2] - C.prizes[N - 1])})</b>`);
  if (C.others > 0) status += row("🪑", t("다른 테이블 {n}명", { n: C.others }), t("모두 평균 {x}이라고 보고 계산했어요.", { x: stackText(C.otherStack) }));
  else status += row("🏆", t("파이널 테이블"), t("남은 인원이 모두 이 테이블이라 정확하게 계산했어요."));
  if (C.trimmed) status += row("✂️", t("상금 순위 정리"), t("남은 인원보다 상금 순위가 많아서 위에서 {n}개만 사용했어요.", { n: N }));

  app.innerHTML = `
    <h1 class="title">${t("결과")}</h1>
    <p class="lead">${t("내 결정을 상금 기준으로 복기해요.")}</p>

    ${verdictSection(D)}
    <button class="sharebtn" id="shareBtn">📷 ${t("결과 이미지 저장·공유")}</button>
    ${decisionSection(D)}
    ${lineErr}
    ${linesSection()}
    ${equitySection(R.equity)}

    <section class="card icm-card">
      <div class="card-head"><h2>${t("핸드 전 내 칩의 상금 가치")}</h2><span class="pill">${method}</span></div>
      <div class="icm-big">${won(heroEq)}</div>
      <div class="icm-grid">
        <div><span>${t("내 스택")}</span><b>${stackText(C.stacks[h])}</b></div>
        <div><span>${t("칩 비율")}</span><b>${pct(C.stacks[h] / C.totalChips)}</b></div>
        <div><span>${t("상금 비율")}</span><b>${pct(heroEq / pool)}</b></div>
      </div>
      <p class="help">${t("칩 비율대로 나누면 {x}", { x: won(fair) })} · ${t("ICM 차이")} <b class="${cls(diff)}">${sgnWon(diff)}</b></p>
      <div class="icm-status">${status}</div>
    </section>

    <section class="card">
      <h2>${t("테이블 전체")}</h2>
      ${R.eq.map((v, i) => `
        <div class="rrow ${i === h ? "me" : ""}">
          <div class="rpos">${pos[i]}${i === h ? ` (${t("나")})` : ""}<small>${stackText(C.stacks[i])}</small></div>
          <div class="rval">${won(v)}<small>${pct(v / pool)}</small></div>
          <div class="rbar"><i style="width:${(v / maxEq * 100).toFixed(1)}%"></i></div>
        </div>`).join("")}
    </section>

    <section class="card">
      <h2>${t("수정하기")}</h2>
      <div class="edit-grid">
        <button data-go="1">${t("대회 정보")}</button><button data-go="2">${t("인원")}</button><button data-go="3">${t("스택")}</button><button data-go="4">${t("핸드")}</button><button data-go="5">${t("라인")}</button>
      </div>
    </section>`;
  app.querySelectorAll(".edit-grid button").forEach(b => b.onclick = () => goTo(+b.dataset.go));
  document.getElementById("shareBtn").onclick = shareResult;
}

function row(ic, title, text){
  return `<div class="info-row"><div class="info-ic">${ic}</div><div><b>${title}</b><p>${text}</p></div></div>`;
}

/* ================= 설정 · 프리미엄 · 광고 ================= */
// 가격: 원 기준. 일본·영어권 가격이 정해지면 여기만 바꾸면 돼요
const PRICE = { month: 3990, year: 19900 };
const FREE_LINES = 2;          // 무료는 라인 2개까지 (실제 라인 + 1개)
const AD_FREE_VIEWS = 2;       // 결과 화면 처음 2번은 광고 없음, 그 뒤로 한 번 걸러 광고
const AD_CODE = "";            // 실제 광고 코드(예: 애드센스)를 받으면 여기에 넣어요
function priceText(n){ return S.lang === "ko" ? fmt(n) + "원" : "₩" + fmt(n); }
function openModal(html){
  document.getElementById("mIn").innerHTML = html;
  document.getElementById("mSheet").classList.add("show");
  document.getElementById("mBg").classList.add("show");
}
function closeModal(){
  document.getElementById("mSheet").classList.remove("show");
  document.getElementById("mBg").classList.remove("show");
}
function openSettings(){
  openModal(`
    <div class="sheet-head"><b>${t("설정")}</b><button class="mini" id="mClose">${t("닫기")}</button></div>
    <span class="lbl">${t("언어")}</span>
    <div class="langs">${Object.entries(LANGS).map(([k, v]) => `<button data-l="${k}" class="${S.lang === k ? "on" : ""}">${v}</button>`).join("")}</div>
    <span class="lbl" style="margin-top:16px">${t("이용 중인 요금제")}</span>
    <div class="planrow"><b>${S.premium ? t("프리미엄") : t("무료")}</b>${S.premium ? "" : `<button class="mini" id="goPrem">${t("프리미엄 보기 ›")}</button>`}</div>
    <div class="devrow"><span>${t("테스트 모드: 프리미엄 켜기")}</span><button class="switch ${S.premium ? "on" : ""}" id="devPrem" aria-label="premium test"><i></i></button></div>
    <p class="help" style="margin-top:4px">${t("결제 연결 전까지 프리미엄 화면을 확인하는 용도예요.")}</p>
    <div class="doclinks"><button class="mini" data-doc="privacy">${t("개인정보처리방침")} ›</button><button class="mini" data-doc="terms">${t("이용약관")} ›</button></div>`);
  document.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(b.dataset.doc));
  document.getElementById("mClose").onclick = closeModal;
  document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
    S.lang = b.dataset.l; save(); closeModal();
    if (S.step === 6 && lastRes) { renderChrome(); result(); } else render();
  });
  const gp = document.getElementById("goPrem"); if (gp) gp.onclick = () => openPaywall();
  document.getElementById("devPrem").onclick = () => {
    S.premium = !S.premium; save(); openSettings();
    if (S.step === 5) drawLines();
  };
}
// 개인정보처리방침 · 이용약관 (앱 안에서 바로 보기)
function openDoc(name){
  openModal(`
    <div class="sheet-head"><b>${t(name === "privacy" ? "개인정보처리방침" : "이용약관")}</b><button class="mini" id="mClose">${t("닫기")}</button></div>
    <iframe class="docframe" src="${name}.html?embed=1&lang=${S.lang}" title="${name}"></iframe>`);
  document.getElementById("mClose").onclick = closeModal;
}
function openPaywall(reason){
  const perMonth = Math.round(PRICE.year / 12), off = Math.round((1 - perMonth / PRICE.month) * 100);
  openModal(`
    <div class="sheet-head"><b>⭐ ${t("프리미엄")}</b><button class="mini" id="mClose">${t("닫기")}</button></div>
    ${reason === "lines" ? `<p class="pw-reason">${t("무료 버전은 라인을 {n}개까지 비교할 수 있어요.", { n: FREE_LINES })}</p>` : ""}
    <ul class="pw-list">
      <li>✓ ${t("광고 없이 결과 보기")}</li>
      <li>✓ ${t("라인 무제한 비교 (최대 6개)")}</li>
    </ul>
    <div class="plans">
      <button class="plan on" data-p="year"><span class="badge3">${t("{p}% 할인", { p: off })}</span><b>${t("연간")}</b><span>${priceText(PRICE.year)}</span><small>${t("월 {x}꼴", { x: priceText(perMonth) })}</small></button>
      <button class="plan" data-p="month"><b>${t("월간")}</b><span>${priceText(PRICE.month)}</span><small>${t("매달 결제")}</small></button>
    </div>
    <button class="btn primary" id="buyBtn" style="width:100%;margin-top:12px">${t("구독하기")}</button>
    <p class="help" style="text-align:center">${t("결제 기능은 준비 중이에요.")}</p>`);
  document.getElementById("mClose").onclick = closeModal;
  document.querySelectorAll(".plan").forEach(b => b.onclick = () => document.querySelectorAll(".plan").forEach(x => x.classList.toggle("on", x === b)));
  document.getElementById("buyBtn").onclick = () => toast(t("결제 기능은 준비 중이에요."));
}
// 결과를 볼 때마다 횟수를 세고, 무료면 2회 이후 한 번 걸러 광고
function maybeShowAd(){
  S.resultViews = (S.resultViews || 0) + 1; save();
  if (S.premium) return;
  const v = S.resultViews;
  if (v <= AD_FREE_VIEWS || (v - AD_FREE_VIEWS - 1) % 2 !== 0) return;
  const ov = document.getElementById("adOv");
  ov.innerHTML = `
    <div class="adbox">
      <div class="ad-top"><span class="adtag">${t("광고")}</span><button class="mini" id="adClose" disabled>${t("닫기")} (3)</button></div>
      <div class="ad-slot">${AD_CODE || `<span>${t("광고 자리 (테스트)")}</span>`}</div>
      <button class="mini" id="adPrem" style="margin-top:10px">${t("광고 없이 쓰기 · 프리미엄 ›")}</button>
    </div>`;
  ov.classList.add("show");
  let n = 3; const btn = document.getElementById("adClose");
  const tick = () => { n--; if (n > 0) { btn.textContent = `${t("닫기")} (${n})`; setTimeout(tick, 1000); } else { btn.textContent = t("닫기"); btn.disabled = false; } };
  setTimeout(tick, 1000);
  btn.onclick = () => ov.classList.remove("show");
  document.getElementById("adPrem").onclick = () => { ov.classList.remove("show"); openPaywall(); };
}
document.getElementById("setBtn").onclick = openSettings;
document.getElementById("mBg").onclick = closeModal;

/* ================= 공통 버튼 ================= */
document.getElementById("prevBtn").onclick = () => S.step === 1 ? goHome() : goTo(S.step === 6 ? 5 : S.step - 1);
document.getElementById("nextBtn").onclick = () => S.step === 6 ? goHome() : goTo(S.step + 1);
document.querySelectorAll("#unitSeg button").forEach(b => b.onclick = () => {
  if (S.unit === b.dataset.u) return;
  S.unit = b.dataset.u; save();
  if (S.step === 6 && lastRes) { renderChrome(); result(); } else render();
});

/* ================= 앱(안드로이드) 뒤로가기 ================= */
(function(){
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform() || !C.Plugins.App) return;
  let lastBack = 0;
  C.Plugins.App.addListener("backButton", () => {
    const ad = document.getElementById("adOv");
    if (ad.classList.contains("show")) { const b = document.getElementById("adClose"); if (b && !b.disabled) ad.classList.remove("show"); return; }
    if (document.getElementById("guideOv").classList.contains("show")) return closeGuide();
    if (document.getElementById("mBg").classList.contains("show")) return closeModal();
    if (document.getElementById("sheetBg").classList.contains("show")) return closeSheet();
    if (view !== "home") return S.step > 1 ? goTo(S.step - 1) : goHome();
    const now = Date.now();
    if (now - lastBack < 2000) return C.Plugins.App.exitApp();
    lastBack = now; toast(t("한 번 더 누르면 종료돼요."));
  });
})();

render();
</script>
</body>
</html>
