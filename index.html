<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토너먼트 ICM 계산기</title>
<style>
:root{
  --bg:#f5f6f8;--card:#ffffff;--text:#1b1f24;--muted:#6b7280;--line:#e2e5e9;
  --accent:#0f766e;--accent-soft:#d5f5ef;--felt:#17704c;--felt-edge:#5b3a1e;
  --seat:#ffffff;--warn:#9a5b00;--warn-soft:#fdf1d6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa0a6;--line:#2a2f37;
    --accent:#2dd4bf;--accent-soft:#12403b;--felt:#0f4a33;--felt-edge:#3f2a15;
    --seat:#20242b;--warn:#f5c451;--warn-soft:#3a2f10;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
textarea{min-height:120px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
@media (prefers-color-scheme: dark){.btn{color:#062b27}}
.btn:disabled{opacity:.6}

/* 테이블 그림 */
.table-wrap{position:relative;width:100%;aspect-ratio:16/10;margin:4px 0 8px}
.felt{position:absolute;inset:14% 12%;border-radius:999px;background:var(--felt);
  border:8px solid var(--felt-edge);display:flex;align-items:center;justify-content:center;
  color:#e7f5ee;font-size:12px;text-align:center;padding:8px}
.seat{position:absolute;transform:translate(-50%,-50%);min-width:64px;padding:4px 6px;border-radius:10px;
  background:var(--seat);border:1px solid var(--line);text-align:center;font-size:11px;line-height:1.3;
  box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seat b{display:block;font-size:12px}
.seat.hero{border:2px solid var(--accent);background:var(--accent-soft)}
.seat .ev{color:var(--accent);font-weight:700}

/* 좌석 편집 목록 */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px 64px 1fr 44px;gap:8px;align-items:center}
.row .pos{font-weight:700;font-size:13px}
.row .hero-pick{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.row .hero-pick input{width:auto}
.row .reset{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 0;font-size:12px}

/* 결과 */
.summary{background:var(--accent-soft);border-radius:11px;padding:12px;margin-bottom:12px}
.summary .big{font-size:22px;font-weight:800}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.info{font-size:13px;margin:4px 0}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.hero td{background:var(--accent-soft);font-weight:700}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>토너먼트 ICM 계산기</h1>
  <p class="sub">스택과 상금 구조를 넣으면 각 칩이 실제 상금으로 얼마의 가치인지 계산해요. (1단계)</p>

  <section class="card">
    <h2>1. 토너먼트 정보</h2>
    <div class="grid">
      <div><label>SB</label><input id="sb" inputmode="decimal" value="1000"></div>
      <div><label>BB</label><input id="bb" inputmode="decimal" value="2000"></div>
      <div><label>앤티</label><input id="ante" inputmode="decimal" value="2000"></div>
      <div><label>남은 총 인원</label><input id="totalPlayers" inputmode="numeric" value="9"></div>
      <div><label>에버리지 스택</label><input id="avgStack" inputmode="decimal" value="50000"></div>
    </div>
    <p class="hint">숫자에 "만", "억", "k"를 붙여도 돼요. 예: 5만, 1.2억, 50k</p>
  </section>

  <section class="card">
    <h2>2. 남은 상금 구조</h2>
    <textarea id="payouts" placeholder="1등부터 한 줄에 하나씩">500만
300만
200만
150만
120만
100만
80만
60만
50만</textarea>
    <p class="hint">1등부터 순서대로, 아직 남은 순위만 적어요. 같은 금액이 여러 순위면 <b>"30만 x9"</b>처럼 적으면 9개 순위로 계산해요.</p>
  </section>

  <section class="card">
    <h2>3. 내 테이블</h2>
    <div class="grid" style="margin-bottom:10px">
      <div><label>테이블 인원</label>
        <select id="seatCount">
          <option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option selected>9</option>
        </select>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap"><div class="felt" id="feltText">스택을 비워두면<br>에버리지로 계산해요</div></div>
    <div class="rows" id="rows"></div>
    <p class="hint">스택 칸이 비어 있으면 에버리지 스택으로 계산해요. 기억나는 사람만 수정하면 돼요.</p>
  </section>

  <button class="btn" id="calcBtn">계산하기</button>

  <section class="card hidden" id="resultCard" style="margin-top:14px">
    <h2>결과 <span class="badge" id="methodBadge"></span></h2>
    <div id="warnBox" class="warn hidden"></div>
    <div id="summary" class="summary hidden"></div>
    <div id="bubbleInfo"></div>
    <div class="scroll"><table id="resultTable"></table></div>
  </section>
</main>

<script>
const POS9 = ["UTG","UTG+1","UTG+2","LJ","HJ","CO","BTN","SB","BB"];
function positionsFor(n){ return n === 2 ? ["BTN/SB","BB"] : POS9.slice(9 - n); }

// "5만", "1.2억", "50k", "1,000" 같은 입력을 숫자로 바꿔요
function parseNum(s){
  if (s == null) return NaN;
  s = String(s).replace(/[,\s]/g, "");
  if (!s) return NaN;
  let mult = 1;
  if (/억$/.test(s)) { mult = 1e8; s = s.slice(0, -1); }
  else if (/만$/.test(s)) { mult = 1e4; s = s.slice(0, -1); }
  else if (/[kK]$/.test(s)) { mult = 1e3; s = s.slice(0, -1); }
  const v = parseFloat(s);
  return isFinite(v) ? v * mult : NaN;
}

function parsePayouts(text){
  const out = [];
  for (const raw of text.split("\n")) {
    const line = raw.replace(/[,\s]/g, "");
    if (!line) continue;
    const m = line.match(/^([^x×*]+)(?:[x×*](\d+))?$/i);
    if (!m) return { error: `"${raw.trim()}" 줄을 이해하지 못했어요.` };
    const amt = parseNum(m[1]);
    const cnt = m[2] ? parseInt(m[2], 10) : 1;
    if (!isFinite(amt) || amt < 0) return { error: `"${raw.trim()}" 금액을 확인해줘.` };
    for (let i = 0; i < cnt; i++) out.push(amt);
  }
  if (!out.length) return { error: "상금 구조를 한 줄 이상 입력해줘." };
  return { prizes: out };
}

// 숫자 보기 좋게
function fmt(n){ return Math.round(n).toLocaleString("ko-KR"); }
function fmtShort(n){
  const a = Math.abs(n);
  if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 1 : 2).replace(/\.?0+$/, "") + "억";
  if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/, "") + "만";
  return fmt(n);
}
function pct(x){ return (x * 100).toFixed(1) + "%"; }

// ---------- 좌석 상태 ----------
let seats = [];       // { stack: "" }
let heroIndex = 6;    // 기본값: BTN
let lastResult = null;

function rebuildSeats(){
  const n = parseInt(document.getElementById("seatCount").value, 10);
  const old = seats;
  seats = [];
  for (let i = 0; i < n; i++) {
    const src = old[old.length - n + i];
    seats.push({ stack: src ? src.stack : "" });
  }
  heroIndex = Math.min(Math.max(n - 3, 0), n - 1); // BTN 위치
  if (n === 2) heroIndex = 0;
  lastResult = null;
  renderRows();
  renderTable();
}

function renderRows(){
  const pos = positionsFor(seats.length);
  const avg = parseNum(document.getElementById("avgStack").value);
  const box = document.getElementById("rows");
  box.innerHTML = "";
  seats.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <label class="hero-pick"><input type="radio" name="hero" ${i === heroIndex ? "checked" : ""}> 나</label>
      <div class="pos">${pos[i]}</div>
      <input inputmode="decimal" placeholder="${isFinite(avg) ? fmt(avg) + " (에버)" : "스택"}" value="${s.stack}">
      <button class="reset" title="에버리지로">초기화</button>`;
    const [radio] = row.querySelectorAll('input[type="radio"]');
    const stackInput = row.querySelector('input[inputmode]');
    radio.addEventListener("change", () => { heroIndex = i; renderTable(); });
    stackInput.addEventListener("input", e => { seats[i].stack = e.target.value; lastResult = null; renderTable(); });
    row.querySelector(".reset").addEventListener("click", () => { seats[i].stack = ""; lastResult = null; renderRows(); renderTable(); });
    box.appendChild(row);
  });
}

function seatStack(i){
  const v = parseNum(seats[i].stack);
  return isFinite(v) ? v : parseNum(document.getElementById("avgStack").value);
}

function renderTable(){
  const wrap = document.getElementById("tableWrap");
  wrap.querySelectorAll(".seat").forEach(el => el.remove());
  const n = seats.length;
  const pos = positionsFor(n);
  const bb = parseNum(document.getElementById("bb").value);
  for (let i = 0; i < n; i++) {
    // BTN이 아래쪽 근처에 오도록 시계방향으로 배치
    const angle = Math.PI / 2 + (i - (n - 3)) * (2 * Math.PI / n);
    const x = 50 + 44 * Math.cos(angle);
    const y = 50 + 42 * Math.sin(angle);
    const st = seatStack(i);
    const el = document.createElement("div");
    el.className = "seat" + (i === heroIndex ? " hero" : "");
    el.style.left = x + "%";
    el.style.top = y + "%";
    let html = `<b>${pos[i]}${i === heroIndex ? " (나)" : ""}</b>`;
    html += isFinite(st) && isFinite(bb) && bb > 0 ? `${(st / bb).toFixed(1)}BB` : "-";
    if (lastResult) html += `<div class="ev">${fmtShort(lastResult.eq[i])}</div>`;
    el.innerHTML = html;
    wrap.appendChild(el);
  }
}

// ---------- ICM 계산 ----------
// 정확한 계산 (남은 인원이 모두 이 테이블에 있을 때)
function icmExact(stacks, prizes){
  const n = stacks.length;
  const eq = new Array(n).fill(0);
  const k = Math.min(prizes.length, n);
  function rec(used, total, place, prob){
    if (place >= k || total <= 0) return;
    for (let i = 0; i < n; i++) {
      if (used & (1 << i)) continue;
      const s = stacks[i];
      if (s <= 0) continue;
      const p = prob * s / total;
      eq[i] += p * prizes[place];
      rec(used | (1 << i), total - s, place + 1, p);
    }
  }
  rec(0, stacks.reduce((a, b) => a + b, 0), 0, 1);
  return eq;
}

// 시뮬레이션 계산 (다른 테이블 인원이 있을 때). 같은 ICM 모델을 수만 번 굴려서 평균을 내요.
function icmSimulate(stacks, others, otherStack, prizes, samples, onProgress){
  return new Promise(resolve => {
    const n = stacks.length, k = prizes.length;
    const eq = new Float64Array(n);
    const ts = new Float64Array(n), thr = new Float64Array(n);
    const bucket = new Int32Array(n + 1);
    const idx = [...Array(n).keys()];
    let done = 0;
    const chunk = 1000;
    function run(){
      const end = Math.min(samples, done + chunk);
      for (; done < end; done++) {
        for (let i = 0; i < n; i++) ts[i] = -Math.log(1 - Math.random()) / stacks[i];
        idx.sort((a, b) => ts[a] - ts[b]);
        for (let j = 0; j < n; j++) { thr[j] = Math.exp(-otherStack * ts[idx[j]]); bucket[j] = 0; }
        bucket[n] = 0;
        for (let r = 0; r < others; r++) {
          const w = Math.random();
          let j = 0;
          while (j < n && thr[j] >= w) j++;
          bucket[j]++;
        }
        let before = 0;
        for (let j = 0; j < n; j++) {
          before += bucket[j];
          const rank = j + before;
          if (rank < k) eq[idx[j]] += prizes[rank];
        }
      }
      onProgress && onProgress(done / samples);
      if (done < samples) setTimeout(run, 0);
      else resolve(Array.from(eq, v => v / samples));
    }
    run();
  });
}

async function calculate(){
  const btn = document.getElementById("calcBtn");
  const warnBox = document.getElementById("warnBox");
  const card = document.getElementById("resultCard");
  const warns = [];

  const n = seats.length;
  const N = parseInt(parseNum(document.getElementById("totalPlayers").value), 10);
  const avg = parseNum(document.getElementById("avgStack").value);
  const bb = parseNum(document.getElementById("bb").value);
  const pay = parsePayouts(document.getElementById("payouts").value);

  function fail(msg){
    card.classList.remove("hidden");
    warnBox.textContent = msg;
    warnBox.classList.remove("hidden");
    document.getElementById("summary").classList.add("hidden");
    document.getElementById("bubbleInfo").innerHTML = "";
    document.getElementById("resultTable").innerHTML = "";
    document.getElementById("methodBadge").textContent = "";
  }

  if (pay.error) return fail(pay.error);
  if (!isFinite(N) || N < n) return fail(`남은 총 인원(${isFinite(N) ? N : "?"})이 테이블 인원(${n})보다 적어요. 숫자를 확인해줘.`);
  if (!isFinite(avg) || avg <= 0) return fail("에버리지 스택을 입력해줘.");

  const stacks = seats.map((_, i) => seatStack(i));
  if (stacks.some(s => !isFinite(s) || s <= 0)) return fail("스택은 0보다 큰 숫자로 입력해줘.");

  let prizes = pay.prizes.slice(0, N);
  if (pay.prizes.length > N) warns.push(`상금 순위가 남은 인원보다 많아서 위에서 ${N}개만 사용했어요.`);

  const others = N - n;
  const tableChips = stacks.reduce((a, b) => a + b, 0);
  let otherStack = 0, eq, method;

  btn.disabled = true;
  if (others === 0) {
    eq = icmExact(stacks, prizes);
    method = "정확";
  } else {
    otherStack = (N * avg - tableChips) / others;
    if (otherStack <= 0) { btn.disabled = false; return fail("테이블 칩 합계가 전체 칩(남은 인원 × 에버리지)보다 많아요. 에버리지나 남은 인원을 확인해줘."); }
    btn.textContent = "계산 중...";
    eq = await icmSimulate(stacks, others, otherStack, prizes, 20000,
      p => { btn.textContent = `계산 중... ${Math.round(p * 100)}%`; });
    method = "근사 (시뮬레이션)";
  }
  btn.disabled = false;
  btn.textContent = "계산하기";

  lastResult = { eq };
  renderTable();

  const totalChips = others === 0 ? tableChips : N * avg;
  const pool = prizes.reduce((a, b) => a + b, 0);
  const pos = positionsFor(n);

  // 요약 (나)
  const h = heroIndex;
  const sum = document.getElementById("summary");
  sum.innerHTML = `
    <div class="info">내 칩 가치 (${pos[h]})</div>
    <div class="big">${fmt(eq[h])}</div>
    <div class="info">칩 비율 <b>${pct(stacks[h] / totalChips)}</b> → 상금 가치 비율 <b>${pct(eq[h] / pool)}</b></div>`;
  sum.classList.remove("hidden");

  // 인머니 / 머니점프
  const paid = prizes.length;
  let info = "";
  if (N > paid) {
    info = `<p class="info">🫧 인머니까지 <b>${N - paid}명</b> 남음 · 최소 상금 ${fmt(prizes[paid - 1])}</p>`;
  } else if (N >= 2) {
    info = `<p class="info">💰 인머니 진입 · 현재 최소 보장 ${fmt(prizes[N - 1])} → 1명 더 탈락하면 ${fmt(prizes[N - 2])} (+${fmt(prizes[N - 2] - prizes[N - 1])})</p>`;
  }
  if (others > 0) info += `<p class="info">다른 테이블 ${others}명은 평균 ${fmt(otherStack)}칩으로 계산했어요.</p>`;
  document.getElementById("bubbleInfo").innerHTML = info;

  // 표
  let rows = `<tr><th>포지션</th><th>스택</th><th>BB</th><th>칩%</th><th>ICM 가치</th><th>상금%</th></tr>`;
  for (let i = 0; i < n; i++) {
    rows += `<tr class="${i === h ? "hero" : ""}">
      <td>${pos[i]}${i === h ? " (나)" : ""}</td>
      <td>${fmtShort(stacks[i])}</td>
      <td>${isFinite(bb) && bb > 0 ? (stacks[i] / bb).toFixed(1) : "-"}</td>
      <td>${pct(stacks[i] / totalChips)}</td>
      <td>${fmt(eq[i])}</td>
      <td>${pct(eq[i] / pool)}</td></tr>`;
  }
  document.getElementById("resultTable").innerHTML = rows;
  document.getElementById("methodBadge").textContent = method;

  if (warns.length) { warnBox.textContent = warns.join(" "); warnBox.classList.remove("hidden"); }
  else warnBox.classList.add("hidden");
  card.classList.remove("hidden");
  card.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("seatCount").addEventListener("change", rebuildSeats);
document.getElementById("avgStack").addEventListener("input", () => { lastResult = null; renderRows(); renderTable(); });
document.getElementById("bb").addEventListener("input", renderTable);
document.getElementById("calcBtn").addEventListener("click", calculate);
rebuildSeats();
</script>
</body>
</html>
